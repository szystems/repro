version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: repro-laravel-app
    container_name: repro-app
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "9000:9000"
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: repro-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reprodb
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: reprouser
      MYSQL_PASSWORD: repropass
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  nginx:
    image: nginx:alpine
    container_name: repro-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: repro-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: reprouser
      PMA_PASSWORD: repropass
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  dbdata:
